services:
  caddy:
    image: caddy:2-alpine
    container_name: rag-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/caddy/logs:/var/log/caddy
    networks:
      - rag-network
    depends_on:
      - go-api-gateway
      - angular-ui
      - jenkins
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:15-alpine
    container_name: nexus_postgres
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus_db
    # Port NOT exposed publicly — only reachable inside rag-network
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: rag-qdrant
    restart: always
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  python-rag-engine:
    build:
      context: .
      dockerfile: apps/api-python/Dockerfile.python
    container_name: rag-python-engine
    restart: always
    environment:
      - QDRANT_HOST=rag-qdrant
      - QDRANT_PORT=6333
      - VECTOR_BACKEND=qdrant
      - UPLOAD_PATH=/app/uploads
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    networks:
      - rag-network
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  go-api-gateway:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile.go
    container_name: rag-go-api
    restart: always
    environment:
      - PORT=8080
      - UI_ORIGIN=${UI_ORIGIN:-*}
      - RAG_ENGINE=qdrant
      - PYTHON_SERVICE_URL=http://rag-python-engine:8000
      - DB_URL=postgres://nexus:${POSTGRES_PASSWORD}@nexus_postgres:5432/nexus_db?sslmode=disable
      - UPLOAD_PATH=/app/uploads
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      python-rag-engine:
        condition: service_healthy
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  angular-ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: rag-angular-ui
    restart: always
    networks:
      - rag-network
    depends_on:
      - go-api-gateway
    deploy:
      resources:
        limits:
          memory: 128M

  jenkins:
    image: jenkins/jenkins:lts
    container_name: rag-jenkins
    restart: always
    privileged: true
    user: root
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    volumes:
      - ./data/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 1G

  smee:
    image: ghcr.io/probot/smee-client:latest
    container_name: rag-smee
    restart: always
    command: ["smee", "--url", "${SMEE_URL}", "--target", "http://jenkins:8080/jenkins/github-webhook/"]
    depends_on:
      - jenkins
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  rag-network:
    driver: bridge
