version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus_postgres
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexus_db
    ports:
      - "5435:5432" # Mapped to 5435 to avoid conflict with existing Host Postgres on 5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 512M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: always
    # Port 6333/6334 removed from public exposure - internal only
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 512M

  python-rag-engine:
    build:
      context: .
      dockerfile: apps/api_python/Dockerfile.python
    container_name: rag-python-engine
    restart: always
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VECTOR_BACKEND=qdrant
      - UPLOAD_PATH=/app/uploads
      - HF_HOME=/app/data/models # Persistent storage for HF models
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    networks:
      - rag-network
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          memory: 2.5G # Increased to accommodate local LLMs

  go-api-gateway:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile.go
    container_name: rag-go-api
    restart: always
    environment:
      - PORT=8080
      - UI_ORIGIN=https://aether-rag-pipeline.duckdns.org
      - RAG_ENGINE=chroma
      - PYTHON_SERVICE_URL=http://python-rag-engine:8000
      - DB_URL=postgres://nexus:password@postgres:5432/nexus_db?sslmode=disable
      - UPLOAD_PATH=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - python-rag-engine
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 256M

  angular-ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: rag-angular-ui
    restart: always
    # Port 4200 removed - will be served via Reverse Proxy on 80
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 128M

  jenkins:
    image: jenkins/jenkins:lts
    container_name: rag-jenkins
    restart: always
    privileged: true
    user: root
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    # Port 8081 removed from public exposure - access via proxy
    volumes:
      - ./data/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 1G

  reverse-proxy:
    image: caddy:2-alpine
    container_name: rag-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rag-network
    depends_on:
      - angular-ui
      - go-api-gateway
      - jenkins

volumes:
  caddy_data:
  caddy_config:

networks:
  rag-network:
    driver: bridge
