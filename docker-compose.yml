services:
  caddy:
    image: caddy:2-alpine
    container_name: rag-caddy
    restart: always
    ports:
      - "8082:80"
      - "8444:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/caddy/logs:/var/log/caddy
    networks:
      - rag-network
    depends_on:
      - go-api-gateway
      - angular-ui
    deploy:
      resources:
        limits:
          memory: 128M

  # Postgres (with pgvector) is NOT managed here — it runs as the standalone
  # "nexus-pg" container (joined to this rag-network separately), mirroring
  # how it'll be an external RDS instance once this moves to AWS.

  python-rag-engine:
    build:
      context: .
      dockerfile: apps/api_python/Dockerfile.python
    container_name: rag-python-engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://nexus:${RDS_PASSWORD}@${RDS_HOST}:5432/nexus_db?sslmode=require
      - UPLOAD_PATH=/app/uploads
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G

  go-api-gateway:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile.go
    container_name: rag-go-api
    restart: always
    environment:
      - PORT=8081
      - UI_ORIGIN=${UI_ORIGIN:-*}
      - RAG_ENGINE=chroma
      - PYTHON_SERVICE_URL=http://rag-python-engine:8000
      - DB_URL=postgres://nexus:${RDS_PASSWORD}@${RDS_HOST}:5432/nexus_db?sslmode=require
      - UPLOAD_PATH=/app/uploads
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_RAW_PDFS_PREFIX=${S3_RAW_PDFS_PREFIX:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      python-rag-engine:
        condition: service_started
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  angular-ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: rag-angular-ui
    restart: always
    networks:
      - rag-network
    depends_on:
      - go-api-gateway
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  rag-network:
    external: true
