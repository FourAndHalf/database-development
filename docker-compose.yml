version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus_postgres
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexus_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 512M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 512M

  python-rag-engine:
    build:
      context: .
      dockerfile: apps/api_python/Dockerfile.python
    container_name: rag-python-engine
    restart: always
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VECTOR_BACKEND=qdrant
    volumes:
      - ./data:/app/data
    networks:
      - rag-network
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          memory: 2G

  go-api-gateway:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile.go
    container_name: rag-go-api
    restart: always
    environment:
      - PORT=8080
      - UI_ORIGIN=http://localhost:4200
      - RAG_ENGINE=qdrant
      - PYTHON_SERVICE_URL=http://python-rag-engine:8000
      - DB_URL=postgres://nexus:password@postgres:5432/nexus_db?sslmode=disable
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - python-rag-engine
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 256M

  angular-ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: rag-angular-ui
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - go-api-gateway
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 128M

  jenkins:
    image: jenkins/jenkins:lts
    container_name: rag-jenkins
    restart: always
    privileged: true
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pgdata:
  qdrant_data:
  jenkins_home:

networks:
  rag-network:
    driver: bridge
