version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus_postgres
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexus_db
    ports:
      - "5435:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 512M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: always
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 512M

  python-rag-engine:
    build:
      context: .
      dockerfile: apps/api-python/Dockerfile.python
    container_name: rag-python-engine
    restart: always
    environment:
      - QDRANT_HOST=rag-qdrant
      - QDRANT_PORT=6333
      - VECTOR_BACKEND=qdrant
      - UPLOAD_PATH=/app/uploads
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel.observability.duckdns.org:4317
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    networks:
      - rag-network
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          memory: 1G

  go-api-gateway:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile.go
    container_name: rag-go-api
    restart: always
    environment:
      - PORT=8080
      - UI_ORIGIN=https://aether-rag-pipeline.duckdns.org
      - RAG_ENGINE=chroma
      - PYTHON_SERVICE_URL=http://rag-python-engine:8000
      - DB_URL=postgres://nexus:password@nexus_postgres:5432/nexus_db?sslmode=disable
      - UPLOAD_PATH=/app/uploads
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel.observability.duckdns.org:4317
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - python-rag-engine
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 256M

  angular-ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: rag-angular-ui
    restart: always
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 128M

  jenkins:
    image: jenkins/jenkins:lts
    container_name: rag-jenkins
    restart: always
    privileged: true
    user: root
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    volumes:
      - ./data/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 1G

  smee:
    image: node:alpine
    container_name: rag-smee
    restart: always
    command: npx smee-client -u ${SMEE_URL} -t http://jenkins:8080/jenkins/github-webhook/
    depends_on:
      - jenkins
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
