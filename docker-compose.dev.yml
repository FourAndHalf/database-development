services:
  nexus-pg:
    image: pgvector/pgvector:pg15
    container_name: nexus-pg
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${NEXUS_PG_PASSWORD}
      POSTGRES_DB: nexus_db
    ports:
      - "5434:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  go-api-gateway:
    environment:
      - DB_URL=postgres://nexus:${NEXUS_PG_PASSWORD}@nexus-pg:5432/nexus_db?sslmode=disable
    depends_on:
      nexus-pg:
        condition: service_healthy
