name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy bandit pip-audit

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy services scripts --ignore-missing-imports

      - name: Security scan
        run: bandit -r services scripts -x tests

      - name: Dependency audit
        run: pip-audit --desc --ignore-vuln GHSA-w596-4wvx-j9j6 || true

      - name: Run tests
        run: pytest -q

  build-artifacts:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build source package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build || true

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-build
          path: |
            dist/
          if-no-files-found: ignore
